<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

<body class="bg-[#FFFFFF] text-slate-800 flex h-screen overflow-hidden">

    <!-- ========================================== -->
    <!-- BAGIAN 1: HALAMAN AUTH (LOGIN & REGISTER) -->
    <!-- ========================================== -->
    <div id="auth-view" class="fixed inset-0 bg-[#102A56]/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#FFFFFF] w-full max-w-md p-8 rounded-3xl shadow-2xl border border-slate-100">
            
            <div class="text-center mb-6">
                <img src="Logo Mathmate.jpg" alt="Logo MathMate" class="w-16 h-16 object-contain mx-auto mb-3 rounded-2xl border border-slate-200 p-1 bg-[#FFFFFF]">
                <h2 id="auth-title" class="brand-title text-2xl font-extrabold">
                    <span class="text-[#102A56]">Math</span><span class="text-[#00B4B4]">Mate</span>
                    <span class="text-[#102A56]">TKA SMA</span>
                </h2>
                <p id="auth-subtitle" class="text-sm text-slate-500 mt-1">Platform persiapan intensif Tes Kemampuan Akademik.</p>
            </div>

            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#00B4B4] text-sm font-semibold" placeholder="siswa@sma.ac.id">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#00B4B4] text-sm font-semibold" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-[#102A56] hover:bg-[#0d2246] text-[#FFFFFF] font-bold py-3.5 rounded-2xl transition shadow-md">Masuk ke Home</button>
                <p class="text-center text-xs text-slate-500 mt-4">
                    Belum punya akun? <button type="button" onclick="toggleAuthMode('register')" class="text-[#00B4B4] font-bold hover:underline">Daftar Akun Baru</button>
                </p>
            </form>

            <!-- FORM REGISTER -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-nama" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#00B4B4] text-sm font-semibold" placeholder="Citra Lestari">

                    <select id="reg-kelas" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#00B4B4] text-sm font-semibold bg-[#FFFFFF]">
                        <option value="saintek">TKA Saintek</option>
                        <option value="soshum">TKA Soshum</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#00B4B4] text-sm font-semibold" placeholder="siswa@sma.ac.id">
                </div>

                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-[#00B4B4] text-sm font-semibold" placeholder="Buat password rahasia">

                <p class="text-center text-xs text-slate-500 mt-4">
                    Sudah punya akun? <button type="button" onclick="toggleAuthMode('login')" class="text-[#00B4B4] font-bold hover:underline">Masuk</button>
                </p>

        </div>

    <!-- BAGIAN 2: DASHBOARD UTAMA -->

    <!-- BACKDROP OVERLAY (TERUTAMA SAAT SIDEBAR MUNCUL DI MOBILE) -->

        // ==========================================
        // TOGGLE NAVIGASI SAMPING KIRI (MUNCUL / SEMBUNYI)
        // ==========================================
        function toggleSidebar(forceState = null) {
            const sidebar = document.getElementById('main-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const toggleIcon = document.getElementById('sidebar-toggle-icon');

            if (typeof forceState === 'boolean') {
                isSidebarOpen = forceState;
            } else {
                isSidebarOpen = !isSidebarOpen;
            }

            if (isSidebarOpen) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
                backdrop.classList.remove('hidden');
                toggleIcon.className = "fa-solid fa-indent text-base";
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
                backdrop.classList.add('hidden');
                toggleIcon.className = "fa-solid fa-bars text-base";
            }
        }

        function autoCloseSidebarOnMobile() {
            if (window.innerWidth < 768) {
                toggleSidebar(false);
            }
        }

        function getRiwayatSkorUser() {
            const user = JSON.parse(localStorage.getItem('mathmate_logged_in') || '{}');
            if (!user.email) return [];
            const key = `mathmate_skor_${user.email}`;
            return JSON.parse(localStorage.getItem(key) || '[]');
        }

        function simpanSkorKeRiwayat(namaSesi, skor, totalSoal) {
            const user = JSON.parse(localStorage.getItem('mathmate_logged_in') || '{}');
            if (!user.email) return;
            const key = `mathmate_skor_${user.email}`;
            let riwayat = JSON.parse(localStorage.getItem(key) || '[]');
            
            const dataBaru = {
                tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                bab: namaSesi,
                skor: skor,
                total: totalSoal
            };
            
            riwayat.unshift(dataBaru);
            localStorage.setItem(key, JSON.stringify(riwayat));
        }

        function setActiveSidebar(mode, kategoriKey = null) {
            document.querySelectorAll('.nav-main-btn').forEach(btn => {
                btn.className = "nav-main-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition text-slate-600 hover:bg-slate-50";
            });
            document.querySelectorAll('.kat-btn').forEach(btn => {
                btn.className = "kat-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm transition text-slate-600 hover:bg-slate-50";
            });

            if (mode === 'home') {
                document.getElementById('nav-btn-home').className = "nav-main-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition text-[#102A56] bg-teal-50 border border-teal-100";
            } else if (mode === 'progres') {
                document.getElementById('nav-btn-progres').className = "nav-main-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition text-[#102A56] bg-teal-50 border border-teal-100";
            } else if (mode === 'materi' && kategoriKey) {
                const activeKat = document.getElementById(`btn-kat-${kategoriKey}`);
                if (activeKat) {
                    activeKat.className = "kat-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm transition text-[#102A56] bg-teal-50 border border-teal-100";
                }
            }
        }

        function checkAuthStatus() {
            const loggedInUser = localStorage.getItem('mathmate_logged_in');
            if (loggedInUser) {
                const user = JSON.parse(loggedInUser);
                document.getElementById('auth-view').classList.add('hidden');
                
                document.getElementById('user-display-name').innerText = `Halo, ${user.nama}`;

        function toggleAuthMode(mode) {
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');

            if (mode === 'register') {
                formLogin.classList.add('hidden');
                formRegister.classList.remove('hidden');
                authTitle.innerHTML = `<span class="text-[#102A56]">Daftar</span> <span class="text-[#00B4B4]">MathMate</span>`;
                authSubtitle.innerText = "Isi identitas untuk mulai mencatat progres belajarmu.";
            } else {
                formRegister.classList.add('hidden');
                formLogin.classList.remove('hidden');
                authTitle.innerHTML = `<span class="text-[#102A56]">Math</span><span class="text-[#00B4B4]">Mate</span> <span class="text-[#102A56]">TKA SMA</span>`;
                authSubtitle.innerText = "Platform persiapan intensif Tes Kemampuan Akademik.";
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const nama = document.getElementById('reg-nama').value;
            const kelas = document.getElementById('reg-kelas').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const userData = { nama, kelas, email, password };

            localStorage.setItem(`mathmate_user_${email}`, JSON.stringify(userData));
            localStorage.setItem('mathmate_logged_in', JSON.stringify(userData));

            alert(`Pendaftaran berhasil! Selamat datang di Home MathMate, ${nama}.`);
            checkAuthStatus();
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const savedUserStr = localStorage.getItem(`mathmate_user_${email}`);

            if (savedUserStr) {
                const savedUser = JSON.parse(savedUserStr);
                if (savedUser.password === password) {
                    localStorage.setItem('mathmate_logged_in', JSON.stringify(savedUser));
                    alert(`Berhasil masuk! Selamat datang kembali, ${savedUser.nama}.`);
                    checkAuthStatus();
                } else {
                    alert('Password salah! Periksa kembali.');
                }
            } else {
                alert('Email belum terdaftar! Silakan daftar akun baru.');
            }
        }

        function handleLogout() {
            localStorage.removeItem('mathmate_logged_in');
            alert('Kamu telah keluar dari akun.');
            checkAuthStatus();
        }

        function openAccountModal() {
            const loggedInUser = localStorage.getItem('mathmate_logged_in');
            if (loggedInUser) {
                const user = JSON.parse(loggedInUser);
                document.getElementById('modal-nama-text').innerText = user.nama;
                document.getElementById('modal-email-text').innerText = user.email;
                document.getElementById('modal-kelas-text').innerText = `TKA ${user.kelas.toUpperCase()}`;
                
                document.getElementById('account-view-mode').classList.remove('hidden');
                document.getElementById('account-edit-mode').classList.add('hidden');
                document.getElementById('account-modal').classList.remove('hidden');
            }
        }

            document.getElementById('account-modal').classList.add('hidden');
        }

            const loggedInUser = JSON.parse(localStorage.getItem('mathmate_logged_in') || '{}');
            document.getElementById('edit-nama').value = loggedInUser.nama || '';
            document.getElementById('edit-kelas').value = databaseTKA[loggedInUser.kelas] ? loggedInUser.kelas : 'saintek';

            event.preventDefault();

            let loggedInUser = JSON.parse(localStorage.getItem('mathmate_logged_in') || '{}');

        function bukaSesiSoal(sesiIndex) {
            const bab = databaseTKA[currentKategori].babList[currentBabIndex];

            let sesiHtml = `
                <div class="bg-[#FFFFFF] p-8 rounded-3xl border border-slate-200 shadow-sm max-w-xl mx-auto space-y-4 mt-6">

                    <h3 class="text-base font-bold text-[#102A56]">${sesi.soal}</h3>
                    <div class="space-y-2">
                        ${sesi.opsi.map((opt, i) => `
                            <button onclick="jawabSesi(${i}, ${sesi.jawabanBenar}, '${bab.namaBab} - ${sesi.namaSesi}')" class="sesi-opt-btn w-full text-left p-3.5 rounded-2xl border border-slate-200 hover:bg-teal-50 font-semibold text-sm transition">${opt}</button>
                        `).join('')}

                    <p id="sesi-feedback" class="text-sm font-bold mt-2 text-center"></p>
                </div>
            `;

            document.getElementById('active-sesi-container').innerHTML = sesiHtml;
        }

        function jawabSesi(selectedIndex, correctIndex, namaSesiLengkap) {
            const buttons = document.querySelectorAll('.sesi-opt-btn');
            buttons.forEach(b => b.disabled = true);

            const feedback = document.getElementById('sesi-feedback');
            let skorDidapat = 0;

            if (selectedIndex === correctIndex) {
                buttons[selectedIndex].className = "w-full text-left p-3.5 rounded-2xl border border-emerald-300 bg-emerald-50 font-bold text-emerald-700 transition";
                feedback.innerHTML = "Jawaban Benar! Skor dicatat ke Progres Belajarmu.";
                feedback.className = "text-sm font-bold mt-2 text-center text-emerald-600";
                skorDidapat = 100;
            } else {
                buttons[selectedIndex].className = "w-full text-left p-3.5 rounded-2xl border border-red-300 bg-red-50 font-bold text-red-700 transition";
                buttons[correctIndex].className = "w-full text-left p-3.5 rounded-2xl border border-emerald-300 bg-emerald-50 font-bold text-emerald-700 transition";
                feedback.innerHTML = "Kurang tepat. Jawaban yang benar ditandai hijau.";
                feedback.className = "text-sm font-bold mt-2 text-center text-red-600";
                skorDidapat = 0;
            }

            simpanSkorKeRiwayat(namaSesiLengkap, skorDidapat, 100);
        }

        window.onload = function() {
            checkAuthStatus();
        };
    </script>
</body>
</html>
